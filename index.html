<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pop-it-logo.png" />
    <link rel="apple-touch-icon" href="/pop-it-logo.png" />
    <link rel="apple-touch-startup-image" href="/pop-it-logo.png" />
    
    <!-- iOS PWA Startup Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POP IT" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="manifest" href="/manifest.json" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>POP IT</title>
    
    <!-- External Styles and Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; background-color: #0F172A;">
    <div id="root">
      <!-- Fast Preloader for iPhone/iOS PWA launch (Prevents white flash screen) -->
      <div style="position: fixed; inset: 0; background: #0F172A; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: 'Outfit', system-ui, sans-serif;">
        <img src="/pop-it-logo.png" alt="POP IT" style="width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.4)); animation: pulse 1.5s ease-in-out infinite;" />
        <div style="margin-top: 18px; color: #F59E0B; font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;">POP IT</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
