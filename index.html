  <body style="margin: 0; background-color: #FFF8F0;">
    <!-- Splash Screen Preloader nativo con Logo POP IT (Visibile per 2 secondi con dissolvenza morbida) -->
    <div id="app-splash-screen" style="position: fixed; inset: 0; background: #FFF8F0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; font-family: 'Outfit', system-ui, sans-serif; transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);">
      <img src="/popit-app/pop-it-logo.png" alt="POP IT" style="width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 6px 20px rgba(245, 158, 11, 0.35)); animation: pulse 1.6s ease-in-out infinite;" />
    </div>

    <div id="root"></div>

    <script>
      // Garantisce che il logo POP IT rimanga visibile per 2.0 secondi con dissolvenza morbida
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var splash = document.getElementById('app-splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 500);
          }
        }, 1800);
      });
    </script>
  </body>
